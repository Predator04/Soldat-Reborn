name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2 (headless Linux)
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Import project
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import

      - name: Python deps for map audit
        run: pip install numpy scipy pillow shapely

      - name: Build master server for the gate's online tests
        # The gate's ranked / matchmaking / friends / relay stages run a real
        # master server from ../server/master-server/dist — the runner has to
        # build it (the game repo checkout doesn't include it).
        run: |
          git clone --depth 1 https://github.com/Predator04/soldat-master-server.git ../server/master-server
          cd ../server/master-server && go build -o dist/soldat-master-linux-amd64 .

      - name: Release gate (quick — static, boots, MP smokes, all modes)
        env:
          GODOT_BIN: ${{ github.workspace }}/Godot_v4.7.2-stable_linux.x86_64
        run: |
          if ! tools/release_gate.sh --quick --out build/gate; then
            # The motion-timing stages (grenade taps, buggy hops, fire cadence)
            # are sensitive to runner load — the free 2-core runners occasionally
            # starve them while the same commit passes locally and in other
            # attempts. Retry the failed stage groups ONCE: a real regression
            # fails both passes, a starved run recovers.
            STAGES=$(grep '^FAIL' build/gate/summary.txt | awk '{print $2}' | sort -u | tr '\n' ' ')
            echo "::warning::gate stages failed (${STAGES}) — retrying once"
            sed -i '/^FAIL/d' build/gate/summary.txt
            tools/release_gate.sh --quick --out build/gate --keep --only "$STAGES"
          fi

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-logs
          path: build/gate/
