name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2 (headless Linux)
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Import project
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import

      - name: Verify (must print zero error lines)
        run: |
          OUT=$(./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 900 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -qiE "error|invalid|nil|failed|attempt"; then
            echo "::error::Headless verify failed"
            exit 1
          fi
          echo "Verify clean"
