name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2 (headless Linux)
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Import project
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import

      - name: Python deps for map audit
        run: pip install numpy scipy pillow shapely

      - name: Release gate (quick — static, boots, MP smokes, all modes)
        env:
          GODOT_BIN: ${{ github.workspace }}/Godot_v4.7.2-stable_linux.x86_64
        run: tools/release_gate.sh --quick --out build/gate

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-logs
          path: build/gate/
